# Fixed GitHub Actions Workflow

```yaml
name: '🧪 Resilient RDP Testbed'

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Runtime (minutes)'
        required: false
        default: '360'
        type: number

env:
  TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

jobs:
  resilient-rdp:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration || '360') }}

    steps:
      - name: '🌀 Generate ephemeral identities'
        shell: pwsh
        run: |
          $runGuid = [System.Guid]::NewGuid().ToString().Substring(0,8)
          $testUser = "ci_$runGuid"
          $fwRuleName = "RDP_$(-join ((65..90)+(97..122) | Get-Random -Count 10 | ForEach-Object {[char]$_}))"
          $hostSuffix = -join ((97..122) | Get-Random -Count 6 | ForEach-Object {[char]$_})

          "TEST_USER=$testUser" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FW_RULE_NAME=$fwRuleName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HOST_SUFFIX=$hostSuffix" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "::add-mask::$testUser"
          Write-Host "::notice::Test run $runGuid initialized"

      - name: '🔧 Configure remote debugging (RDP)'
        shell: pwsh
        run: |
          Write-Host "Enabling RDP..."

          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0

          # Disable NLA
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0

          # Set security layer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0

          # Enable firewall group instead of custom rule
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Ensure service is running
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Start-Sleep -Seconds 5

          Write-Host "RDP configured successfully"

      - name: '👤 Create ephemeral test user'
        shell: pwsh
        run: |
          $special = [char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)

          $pwdChars = \
            (65..90 | Get-Random -Count 4) + \
            (97..122 | Get-Random -Count 4) + \
            (48..57 | Get-Random -Count 4) + \
            ($special | Get-Random -Count 4)

          $password = -join ($pwdChars | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "$env:TEST_USER" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "$env:TEST_USER" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group 'Administrators' -Member "$env:TEST_USER" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "$env:TEST_USER" -ErrorAction SilentlyContinue

          "TEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "::add-mask::$password"
          Write-Host "Temporary user created"

      - name: '🌐 Install Tailscale'
        shell: pwsh
        run: |
          $tailscaleBin = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleBin)) {
            Write-Host "Installing Tailscale..."

            $installer = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
              -OutFile $installer

            Start-Process msiexec.exe `
              -ArgumentList "/i `"$installer`" /qn /norestart" `
              -Wait

            Start-Sleep -Seconds 15
          }

          if (-not (Test-Path $tailscaleBin)) {
            throw 'Tailscale installation failed'
          }

          Write-Host "Tailscale installed successfully"

      - name: '🔐 Connect Tailscale'
        shell: pwsh
        run: |
          $tailscaleBin = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleBin up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="gh-win-$env:HOST_SUFFIX" `
            --accept-routes

          Start-Sleep -Seconds 10

          $tsIP = & $tailscaleBin ip -4

          if (-not $tsIP) {
            throw 'Failed to get Tailscale IP'
          }

          "TS_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "::notice::Tailscale IP: $tsIP"

      - name: '✅ Validate RDP accessibility'
        shell: pwsh
        run: |
          Write-Host "Testing RDP port..."

          $result = Test-NetConnection -ComputerName $env:TS_IP -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw 'RDP validation failed'
          }

          Write-Host "RDP reachable"

      - name: '📡 Keep alive'
        shell: pwsh
        run: |
          $duration = [int]('${{ github.event.inputs.duration || '360' }}')
          $end = (Get-Date).AddMinutes($duration)

          Write-Host ''
          Write-Host '========================================='
          Write-Host 'RDP READY'
          Write-Host "IP: $env:TS_IP"
          Write-Host "USER: $env:TEST_USER"
          Write-Host 'PASSWORD: stored in TEST_PASSWORD env'
          Write-Host '========================================='

          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session alive"

            $listening = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

            if (-not $listening) {
              Write-Host 'Restarting RDP service...'
              Restart-Service TermService -Force
            }

            Start-Sleep -Seconds 60
          }

      - name: '🧹 Cleanup'
        if: always()
        shell: pwsh
        run: |
          Write-Host 'Cleaning up...'

          # Remove temporary user
          if (Get-LocalUser -Name "$env:TEST_USER" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "$env:TEST_USER"
          }

          # Disable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 1

          # Logout Tailscale safely
          $tailscaleBin = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tailscaleBin) {
            & $tailscaleBin logout
          }

          Write-Host 'Cleanup completed'
```

## What Was Fixed

* Replaced broken `Remove-NetFirewallRule` logic causing:
  `No rules match the specified criteria`

* Replaced custom firewall rule creation with:
  `Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'`

* Fixed Tailscale cleanup crash:
  `tailscale.exe is not recognized`

* Added validation after Tailscale install.

* Added proper service startup for `TermService`.

* Fixed YAML expression parsing issues.

* Improved installation reliability with extra wait time.

* Simplified RDP validation logic.

* Prevented workflow from failing during cleanup.

Use this as your full `.github/workflows/rdp.yml` file.
