name: RDP Testbed

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Runtime in minutes
        required: false
        default: "360"

env:
  TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Generate session info
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString().Substring(0,6)

          "TEST_USER=ci_$id" | Out-File $env:GITHUB_ENV -Append
          "HOSTNAME=gh-$id" | Out-File $env:GITHUB_ENV -Append

      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

          Write-Host "RDP enabled"

      - name: Create user
        shell: pwsh
        run: |
          $password = "Pass123!!$((Get-Random -Minimum 1000 -Maximum 9999))"

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name $env:TEST_USER `
            -Password $secure `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:TEST_USER

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:TEST_USER

          "TEST_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

          Write-Host "::notice::USER: $env:TEST_USER"
          Write-Host "::notice::PASS: $password"

      - name: Install Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$env:TEMP\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /qn" `
            -Wait

          Start-Sleep 15

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey=$env:TS_AUTHKEY `
            --hostname=$env:HOSTNAME `
            --accept-routes

          Start-Sleep 10

          $ip = & $ts ip -4

          if (-not $ip) {
            throw "No Tailscale IP"
          }

          "TS_IP=$ip" | Out-File $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "================================"
          Write-Host "RDP READY"
          Write-Host "IP: $ip"
          Write-Host "USER: $env:TEST_USER"
          Write-Host "PASS: $env:TEST_PASSWORD"
          Write-Host "================================"

      - name: Validate RDP
        shell: pwsh
        run: |
          $test = Test-NetConnection `
            -ComputerName $env:TS_IP `
            -Port 3389

          if (-not $test.TcpTestSucceeded) {
            throw "RDP failed"
          }

          Write-Host "RDP OK"

      - name: Keep alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(360)

          while ((Get-Date) -lt $end) {
            Write-Host "Alive: $(Get-Date)"
            Start-Sleep 60
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name $env:TEST_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:TEST_USER
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }

          Write-Host "Cleanup done"
